<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeros Data Converter</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: #0b0b0b; color: #eee;
    font: 15px Arial, sans-serif;
  }
  main { max-width: 1100px; margin: auto; }
  h1 { margin-top: 0; }
  p { color: #aaa; }
  .panels {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  section {
    background: #151515; border: 1px solid #303030;
    border-radius: 10px; padding: 16px;
  }
  label { display: block; margin-bottom: 10px; font-weight: bold; }
  textarea {
    width: 100%; height: 440px; resize: vertical;
    background: #080808; color: #eee;
    border: 1px solid #333; border-radius: 6px;
    padding: 12px; font: 13px/1.5 Consolas, monospace;
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button {
    border: 0; border-radius: 7px; padding: 11px 18px;
    background: #e53935; color: white; font-weight: bold; cursor: pointer;
  }
  button.secondary { background: #292929; border: 1px solid #444; }
  #status { color: #aaa; align-self: center; }
  @media(max-width: 750px) {
    body { padding: 12px; }
    .panels { grid-template-columns: 1fr; }
    textarea { height: 300px; }
  }
</style>
</head>
<body>
<main>
  <h1>Zeros Data Converter</h1>
  <p>Convert your project entries into JSON for your PenguinMod HTTP fetch workflow.</p>

  <div class="panels">
    <section>
      <label for="input">Original data</label>
      <textarea id="input" placeholder="Paste your data entries here..."></textarea>
    </section>
    <section>
      <label for="output">JSON output (projects.json)</label>
      <textarea id="output" readonly placeholder="Converted JSON will appear here..."></textarea>
    </section>
  </div>

  <div class="actions">
    <button id="convert">Convert to JSON</button>
    <button id="copy" class="secondary">Copy JSON</button>
    <button id="download" class="secondary">Download projects.json</button>
    <button id="clear" class="secondary">Clear</button>
    <span id="status"></span>
  </div>
</main>

<script>
function parseEntries(raw) {
  return String(raw)
    .trim()
    .split(/\r?\n\s*\r?\n/)
    .filter(entry => entry.trim());
}

function convertData(raw) {
  const projects = [];

  for (const entry of parseEntries(raw)) {
    const fields = {};

    for (const line of entry.split(/\r?\n/)) {
      const colon = line.indexOf(':');
      if (colon < 0) continue;

      const key = line.slice(0, colon).trim().toLowerCase();
      const value = line.slice(colon + 1).trim();
      if (key) fields[key] = value;
    }

    // Find the Scratch project ID from an explicit field or project URL.
    let id = fields.id || fields.project_id || '';
    const projectURL = fields.url || fields.link || '';

    if (!id) {
      const match = projectURL.match(/\/projects\/(\d+)/i);
      if (match) id = match[1];
    }

    if (!id) continue;

    const cover = fields.cover;
    const coverIsMissing = !cover || /^(n\.?a\.?|none|null)$/i.test(cover);

    projects.push({
      id: String(id),
      title: fields.title || fields.name || `Project ${id}`,
      image: coverIsMissing
        ? `https://uploads.scratch.mit.edu/get_image/project/${id}_480x360.png`
        : cover,
      username: fields.username || fields.creator || '',
      avatar: fields.pfp || fields.avatar || '',
      url: `https://scratch.mit.edu/projects/${id}`
    });
  }

  return projects;
}

const input = document.getElementById('input');
const output = document.getElementById('output');
const status = document.getElementById('status');

document.getElementById('convert').onclick = () => {
  try {
    const projects = convertData(input.value);
    output.value = JSON.stringify(projects, null, 2);
    status.textContent = `Converted ${projects.length} project(s).`;
  } catch (error) {
    status.textContent = `Error: ${error.message}`;
  }
};

document.getElementById('copy').onclick = async () => {
  if (!output.value) return status.textContent = 'Convert data first.';
  try {
    await navigator.clipboard.writeText(output.value);
    status.textContent = 'JSON copied!';
  } catch {
    output.select();
    document.execCommand('copy');
    status.textContent = 'JSON copied!';
  }
};

document.getElementById('download').onclick = () => {
  if (!output.value) return status.textContent = 'Convert data first.';
  const blob = new Blob([output.value], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'projects.json';
  link.click();
  URL.revokeObjectURL(url);
  status.textContent = 'Downloaded projects.json';
};

document.getElementById('clear').onclick = () => {
  input.value = '';
  output.value = '';
  status.textContent = '';
};
</script>
</body>
</html>
